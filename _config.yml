# GitHub Pages Configuration for modulrus.com
title: Modulrus - Digital Product Agency
description: Modern digital product agency website
url: https://modulrus.com
baseurl: ""

# Theme settings (if using a theme)
theme: null

# Build settings
plugins:
  - jekyll-feed

# Exclude from processing
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - .gitignore
  - README.md
  - .prettierrc
  - .prettierignore
  - .eslintrc.json
